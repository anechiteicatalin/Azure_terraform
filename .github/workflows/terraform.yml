name: 'Terraform Azure OIDC Deployment'

on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]

permissions:
id-token: write
contents: read

jobs:
terraform:
name: 'Terraform'
runs-on: ubuntu-latest

env:
  # Variabilele necesare provider-ului Azure pentru autentificarea OIDC
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  
  # Variabilele tale Terraform definite în GitHub Secrets
  TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
  TF_VAR_my_ip: ${{ secrets.TF_VAR_my_ip }}

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Azure login via OIDC
    uses: azure/login@v2
    with:
      client-id: ${{ vars.AZURE_CLIENT_ID }}
      tenant-id: ${{ vars.AZURE_TENANT_ID }}
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3

  - name: Terraform Init
    run: terraform init

  - name: Terraform Plan
    if: github.event_name == 'pull_request'
    run: terraform plan -no-color

  - name: Terraform Apply
    if: github.event_name == 'push'
    run: terraform apply -auto-approve -no-color
